<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo Loco | DA Frontend Masterclass</title>
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/clouds.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/keystrokes.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="scripts/game.js"></script>
</head>

<body class="fullscreen" onload="initGame()">

    <main class="">
        <div class="main-inner">

            <h1 id="title" class="page-title">El pollo Loco</h1>

            <div class="canvas-wrapper">
                <canvas id="canvas" width="1000" height="562">Your browser does not support canvas element !</canvas>
                <div id="gameOverScreen" class="canvas-cover"></div>
                <div id="screenOverlay" class=""></div>
                <div id="startScreen" class="canvas-cover"></div>
                <div class="option-panel">
                    <button id="btnStartGame" class="button" onclick="startGame(event)" data-after="Start Game">
                        <img src="assets/icons/play.svg" alt="play-icon">
                    </button>
                    <div class="game-is-paused-msg option-msg">Game is paused</div>
                    <button id="btnRestartGame" class="button" onclick="restartGame(event)" title="New game (startscreen)">
                        <img src="assets/icons/amend.svg" alt="redo-icon">
                    </button>
                    <button id="btnSurrender" class="button" onclick="gameOver(event)" title="Surrender (game over)">
                        <img src="assets/icons/flag.svg" alt="white-flag-icon">
                    </button>
                    <button id="btntogglePauseGame" class="button" onclick="togglePauseGame(event)" title="play/pause game">
                        <img class="enable" src="assets/icons/pause.svg" alt="pause-icon">
                        <img class="disable hide" src="assets/icons/play.svg" alt="play-icon">
                    </button>
                    <div class="enable-audio-msg option-msg">enable Audio >></div>
                    <button id="btnToggleAudioMute" class="button" onclick="toggleAudioMute(event)" title="play/pause audio">
                        <img class="enable" src="assets/icons/audio-playing.svg" alt="audio-playing-icon">
                        <img class="disable hide" src="assets/icons/audio-muted.svg" alt="audio-muted-toggle-icon">
                    </button>
                    <button id="btnToggleFullscreen" class="button" onclick="toggleFullscreen(event)" title="toggle fullscreen">
                        <img class="enable" src="assets/icons/fullscreen.svg" alt="fullscreen-toggle-icon">
                        <img class="disable hide" src="assets/icons/fullscreen-exit.svg" alt="exit-fullscreen-icon">
                    </button>
                </div>
            </div>


            <div class="nav-panels">
                <div class="nav-panel nav-panel-touch" data-after="Pepe's actions">
                    <button id="btnMoveLeft" class="button xbefore-empty" data-before="[ < ]" data-after="left"><span><<</span></button>
                    <button id="btnMoveRight" class="button xbefore-empty" data-before="[ > ]" data-after="right"><span>>></span></button>
                    <button id="btnJump" class="button" data-before="[ space ]" data-after="jump"><span>>></span></button>
                    <button id="btnThrowBottle" class="button" data-before="[ B ]" data-after="throw"><img src="assets/icons/broken-bottle.svg" alt="broken-bottle-icon"></button>
                    <!-- <button id="btnMoveLeft" class="button icon-btn btn-touch before-empty" data-before="-" data-after="left"><img src="assets/icons/arrow.svg" alt="arrow-left-icon"></button> -->
                    <!-- <button id="btnMoveRight" class="button icon-btn btn-touch before-empty" data-before="-" data-after="right"><img src="assets/icons/arrow.svg" alt="arrow-right-icon"></button> -->
                    <!-- <button id="btnJump" class="button icon-btn btn-touch" data-before="[space]" data-after="jump"><img src="assets/icons/arrow.svg" alt="arrow-up-icon"></button> -->
                    <!-- <button id="btnThrowBottle" class="button icon-btn btn-touch" data-before="[B]" data-after="throw"><img src="assets/icons/broken-bottle.svg" alt="broken-bottle-icon"></button> -->
                    <!-- <button id="btnThrowCoin" class="button btn-touch">Throw Bottle<span>:&emsp;C</span></button> -->
                </div>

            </div>

        </div>
    </main>

</body>
</html>
