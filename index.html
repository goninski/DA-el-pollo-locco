<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo Loco | DA Frontend Masterclass</title>
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/clouds.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/keystrokes.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="scripts/game.js"></script>
</head>

<body class="fullscreen" onload="initGame()">

    <main class="">
        <div class="main-inner">

            <h1 id="title" class="page-title">El pollo Loco</h1>

            <div class="canvas-wrapper">
                <canvas id="canvas" width="1000" height="562">Your browser does not support canvas element !</canvas>
                <div id="gameOverScreen" class="canvas-cover"></div>
                <div id="screenOverlay" class=""></div>
                <div id="startScreen" class="canvas-cover"></div>
                <div class="option-panel">
                    <button id="btnStartGame" class="button" onclick="startGame(event)" data-after="Start Game">
                        <img src="assets/icons/play.svg" alt="play-icon">
                    </button>
                    <div id="playTimer" class="option-msg"></div>
                    <div class="game-is-paused-msg option-msg">Game is paused</div>
                    <button id="btnRestartGame" class="button" onclick="restartGame(event)" title="New game (startscreen)">
                        <img src="assets/icons/forward.svg" alt="replay-icon">
                    </button>
                    <button id="btnSurrender" onclick="gameOver(event)" title="Surrender (game over)">
                        <img src="assets/icons/flag.svg" alt="white-flag-icon">
                    </button>
                    <button id="btnTogglePauseGame" onclick="togglePauseGame(event)" title="play/pause game">
                        <img class="" src="assets/icons/play-pause.svg" alt="play-pause-icon">
                    </button>
                    <div class="enable-audio-msg option-msg">enable Audio >></div>
                    <button id="btnToggleAudioMute" onclick="toggleAudioMute(event)" title="play/pause audio">
                        <img class="enable" src="assets/icons/audio-playing.svg" alt="audio-playing-icon">
                        <img class="disable hide" src="assets/icons/audio-muted.svg" alt="audio-muted-toggle-icon">
                    </button>
                    <button id="btnToggleFullscreen" onclick="toggleFullscreen(event)" title="Fullscreen on/off">
                        <img class="enable" src="assets/icons/fullscreen.svg" alt="Fullscreen-toggle-icon">
                        <img class="disable hide" src="assets/icons/fullscreen-exit.svg" alt="exit-fullscreen-icon">
                    </button>
                    <button id="btnToggleHelp" onclick="toggleHelp(event)" title="Help on/off">
                        <img class="" src="assets/icons/help-fill.svg" alt="question-mark-icon">
                    </button>
                </div>
            </div>
            <div class="nav-panel" data-before="Pepe's actions">
                <div class="button-wrapper">
                    <div class="info-action">Move left</div>
                    <div class="info-key">[ < ]</div>
                    <button id="btnMoveLeft"><img src="assets/icons/spacebar-orange.png" alt="arrow-left-keyboard-icon"><span class="label"><<</span></button>
                </div>
                <div class="button-wrapper">
                    <div class="info-action">Jump</div>
                    <div class="info-key">[ space ]</div>
                    <button id="btnJump"><img src="assets/icons/spacebar-orange.png" alt="spacebar-keyboard-icon-for-jump"><span class="label">JUMP</span></button>
                </div>
                <div class="button-wrapper">
                    <div class="info-action">Throw bottle</div>
                    <div class="info-key">[ B ]</div>
                    <button id="btnThrowBottle"><img src="assets/icons/spacebar-orange.png" alt="arrow-right-keyboard-icon"><img class="label-img" src="assets/icons/broken-bottle.svg" alt="broken-bottle-icon"></button>
                </div>
                <div class="button-wrapper">
                    <div class="info-action">Move right</div>
                    <div class="info-key">[ > ]</div>
                    <button id="btnMoveRight"><img src="assets/icons/spacebar-orange.png" alt="arrow-right-keyboard-icon"><span class="label">>></span></button>
                </div>
            </div>
        </div>
    </main>

    <div id="orientationOverlay">Please turn <br>device or window <br>to portrait orientation !</div>

</body>
</html>
